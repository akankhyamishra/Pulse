name: CI / Deploy to Render

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── 1. Type-check & build: User Service ──────────────────────────────────────
  check-user-service:
    name: User Service — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "user service"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "user service/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  # ── 2. Type-check & build: Frontend ──────────────────────────────────────────
  check-frontend:
    name: Frontend — Vite build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build
        env:
          VITE_USER_SERVICE_URL: ${{ secrets.VITE_USER_SERVICE_URL }}
          VITE_AI_SERVICE_URL: ${{ secrets.VITE_AI_SERVICE_URL }}

  # ── 3. Python lint: AI Service ───────────────────────────────────────────────
  check-ai-service:
    name: AI Service — Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile ai-service/main.py
          python -m py_compile ai-service/dj_agent.py
          python -m py_compile ai-service/hum.py
          python -m py_compile ai-service/nl_search.py
          python -m py_compile ai-service/screenshot_search.py
          python -m py_compile ai-service/weather_music.py
          python -m py_compile ai-service/trending.py

  # ── 4. Deploy to Render (only on push to master/main, all checks must pass) ──
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [check-user-service, check-frontend, check-ai-service]
    if: github.event_name == 'push'

    steps:
      - name: Deploy User Service
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_USER_SERVICE }}" \
            -o /dev/null -w "User Service deploy triggered: HTTP %{http_code}\n"

      - name: Deploy AI Service
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AI_SERVICE }}" \
            -o /dev/null -w "AI Service deploy triggered: HTTP %{http_code}\n"

      - name: Deploy Frontend
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
            -o /dev/null -w "Frontend deploy triggered: HTTP %{http_code}\n"
