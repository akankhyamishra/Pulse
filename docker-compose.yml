version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Microservices ─────────────────────────────────────────────
  user-service:
    build:
      context: "./user service"
    ports:
      - "5000:5000"
    env_file:
      - "./user service/.env"
    environment:
      - MONGO_URI=mongodb://mongo:27017/pulse
      - REDIS_URL=redis://redis:6379
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - PORT=8001
    depends_on:
      - redis
      - qdrant

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - ai-service

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
